<h2>Listado de categorias</h2>

<!-- <pre>{{ categories | json }}</pre> -->

<div class="container container-sm container-md container-lg">
  <table class="data-table">
      <thead>
          <tr>
              <th>Nombre de la categoria</th>
              <th>Descripcion</th>
              <th>Acciones</th>
          </tr>
      </thead>
      <tbody>
        @for ( category of categories; track $index ) {
          <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.description }}</td>
            <td class="actions">
                <a class="btn btn-outline-primary" (click)="goEditCategory( category._id )">Editar</a>
                <a class="btn btn-primary" (click)="removeCategory( category._id )">Eliminar</a>
            </td>
        </tr>
        }
      </tbody>
  </table>
</div>
